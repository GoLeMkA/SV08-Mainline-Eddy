[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: extra_mcu
i2c_software_scl_pin: extra_mcu:PB6
i2c_software_sda_pin: extra_mcu:PB7
x_offset: -16.43
y_offset: 10.22
descend_z: 4.0
max_sensor_hz: 9000000

[bed_mesh]
speed: 250
horizontal_move_z: 2
mesh_min: 18, 18
mesh_max: 332, 332
probe_count: 21, 21
algorithm: bicubic
bicubic_tension: 0.5
split_delta_z: 0.0125
mesh_pps: 3, 3
adaptive_margin: 5
fade_start: 1
fade_end: 10
fade_target: 0

[homing_override]
gcode:
  # Move 5 up, just in case (this is our safety zhop, this needs 'set_position_z: 0' below)
  G91 ; set relative positioning
  G0 Z5 F1000 ; 5 up zhop
  {% if not rawparams or 'Y' in rawparams %}
    {action_respond_info('Homing Y')}
    G28 Y
    G90 ; set absolute positioning
    G0 Y177.5 F6000 ; return to center
    M400 ; Wait for move to finish
  {% endif %}
  {% if not rawparams or 'X' in rawparams %}
    {action_respond_info('Homing X')}
    G28 X
    G90 ; set absolute positioning
    G0 X177.5 F6000 ; return to center
    M400 ; Wait for move to finish
  {% endif %}
  {% if not rawparams or 'Z' in rawparams %}
    {action_respond_info('Homing Z')}
    G90 ; set absolute positioning
    G0 X177.5 Y177.5 F6000 ; return to center, please add your offsets manually if you want to
    G28 Z
    G0 Z10 F1000 ; move to z10 before probe
    SET_Z_FROM_PROBE METHOD=tap # Native Eddy Tap Z reference
    M400 ; Wait for move to finish
  {% endif %}
  G90 ; set absolute positioning
axes: xyz
set_position_z: 0 # This forces the z position to be at 0 when we start homing, so we can move the Z up before homing.

###############################Macros and related################################
# Native vanilla Klipper Eddy Tap Z reference.
# This replaces the old BTT beta SET_GCODE_OFFSET/runtime_offset wrapper.
# First layer babystep is persisted with: Z_OFFSET_APPLY_PROBE METHOD=tap + SAVE_CONFIG.

[gcode_macro SET_Z_FROM_PROBE]
gcode:
    {% set METHOD = params.METHOD|default("tap") %}
    PROBE METHOD={METHOD}
    _SET_Z_FROM_LAST_PROBE
    G0 Z5 F1000

[gcode_macro _SET_Z_FROM_LAST_PROBE]
gcode:
    {% set cur_z = printer.toolhead.position.z|float %}
    {% set probe_z = printer.probe.last_probe_position.z|float %}
    SET_KINEMATIC_POSITION Z={cur_z - probe_z}

# Make UI/button "save Z offset" apply to Eddy Tap by default.
[gcode_macro Z_OFFSET_APPLY_PROBE]
rename_existing: Z_OFFSET_APPLY_PROBE_BASE
gcode:
    {% if 'METHOD' in params %}
        Z_OFFSET_APPLY_PROBE_BASE {rawparams}
    {% else %}
        Z_OFFSET_APPLY_PROBE_BASE METHOD=tap
    {% endif %}

# This macro automates a lot of the frequency mapping process and simplifies the steps significantly.
[gcode_macro PROBE_EDDY_CURRENT_CALIBRATE_AUTO]
gcode:
  BED_MESH_CLEAR
  G28 X Y
  G90 # Abs positioning
  G1 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } F6000
  {% if 'z' not in printer.toolhead.homed_axes %}
    SET_KINEMATIC_POSITION Z={ printer.toolhead.axis_maximum.z-1 } # Allows the user to work it down until it touches.
  {% endif %}
  PROBE_EDDY_CURRENT_CALIBRATE {rawparams}

# This moves the nozzle above the center right heatbed screw so we have a fixed place for our temperature drift calibration (and I don't have to remember the coordinates)
[gcode_macro PROBE_EDDY_MOVE_TO_SCREW]
gcode:
  BED_MESH_CLEAR
  {% if printer.toolhead.homed_axes != "xyz" %}
    G28
  {% endif %}
  G90
  G1 X319 Y176 Z5 F6000