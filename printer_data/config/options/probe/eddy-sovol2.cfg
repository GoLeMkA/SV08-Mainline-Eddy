[probe_eddy_current btt_eddy]
sensor_type: ldc1612
# Интерфейс I2C на инструментальной плате Sovol SV08 (разъем BL_TOUCH)
i2c_mcu: extra_mcu
i2c_software_scl_pin: extra_mcu:PB6
i2c_software_sda_pin: extra_mcu:PB7
# Смещения датчика относительно сопла (уточните под ваше физическое крепление)
x_offset: -16.43
y_offset: 10.22
# Высота срабатывания (виртуальная точка отсчета)
z_offset: 2.0

[bed_mesh]
speed: 250
horizontal_move_z: 2
# Границы сетки с учетом оффсетов (чтобы датчик не вылетал за пределы стола 350x350)
mesh_min: 18, 18
mesh_max: 332, 332
# Для быстрого сканирования (scan) рекомендуется высокая плотность точек
probe_count: 21, 21
algorithm: bicubic
bicubic_tension: 0.5
split_delta_z: 0.0125
mesh_pps: 3, 3
adaptive_margin: 5
fade_start: 1
fade_end: 10
fade_target: 0

[homing_override]
gcode:
    {% if not 'Z' in params and not 'Y' in params and 'X' in params %}
        G90
        G0 Z5 F300
        G28 X
        G0 X348 F1200
    {% elif not 'Z' in params and not 'X' in params and 'Y' in params %}
        G90
        G0 Z5 F300
        G28 Y
        G0 Y360 F1200
    {% elif not 'Z' in params and not 'X' in params and 'Y' in params %}
        G90
        G0 Z5 F300
        G28 Y
        G0 Y360 F1200
        G4 P2000
        M400
        G28 X
        G0 X348 F1200
    {% elif 'Z' in params and not 'X' in params and not 'Y' in params %}
        G90
        # Точка хоминга Z (центр стола с учетом смещения датчика)
        G0 X191 Y165 F3600
        G28 Z
        G0 Z10 F600
    {% else %}
        G90
        G0 Z5 F300
        G28 Y
        G0 Y360 F1200
        G4 P2000
        M400
        G28 X
        G0 X348 F1200
        G90
        # Точка хоминга Z (центр стола с учетом смещения датчика)
        G0 X191 Y165 F3600
        G28 Z
        G0 Z10 F600
    {% endif %}
axes: xyz
set_position_z: 0