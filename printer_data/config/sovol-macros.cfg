[gcode_macro mainled_on]
gcode:
    SET_LED LED=main_led WHITE=1

[gcode_macro mainled_off]
gcode:
    SET_LED LED=main_led WHITE=0

#--------------------------------------------------------------------#
#--------------------------------------------------------------------#

[force_move]
enable_force_move: True

[gcode_macro _global_var]
variable_pause_park:{'x': 0, 'y': 0, 'z': 10, 'e': 1}
variable_cancel_park:{'x': 0, 'y': 350, 'z': 10, 'e': 1}
variable_z_maximum_lifting_distance: 345
variable_pause_resume_travel_speed: 150
variable_bed_mesh_calibrate_target_temp: 55
variable_load_filament_extruder_temp: 230
variable_heat_soak_time: 0 # in minutes
gcode:

[gcode_macro START_PRINT]
description: 
variable_state: 'Prepare'
variable_record_extruder_temp:0
variable_max_record_extruder_temp:0
gcode:
    {% set bedtemp = params.BED_TEMP|default(55)|int %}
    {% set hotendtemp = params.EXTRUDER_TEMP|default(230)|int %}
    {% set heatsoak = params.HEATSOAK|default(True)|int %}
    {% set heatsoak_time = printer['gcode_macro _global_var'].heat_soak_time|default(0)|int %} # takes heatsoak time from global variables
    {% set clean_temp = params.CLEAN_TEMP|default(200)|int %} #by Codex AI
    {% set probe_temp = params.PROBE_TEMP|default(130)|int %} #by Codex AI

    M400
    CLEAR_PAUSE
    G90
    {% if state == 'Prepare' %}

        {action_respond_info("Prepare!")}

        {% if printer['filament_switch_sensor filament_sensor'].enabled == True and
              printer['filament_switch_sensor filament_sensor'].filament_detected != True
        %}
            M117 No filament!
            {action_respond_info("Please Insert filament in Sensor!")}
            CANCEL_PRINT
        {% endif %}

        {% if printer.extruder.temperature < probe_temp %}
            M117 Nozzle pre-heating...
            {action_respond_info("Nozzle pre-heating to probe temp...")} #by Codex AI
            M109 S{probe_temp} #by Codex AI
        {% endif %}

        {% if printer.toolhead.homed_axes|lower != "xyz" %}
            G28
        {% endif %}

        {action_respond_info("Check Heating!")}

        {% if printer.heater_bed.temperature < bedtemp %}
            M117 Bed heating...
            {action_respond_info("Bed heating...")}
            M190 S{bedtemp}
        {% endif %}

        M140 S{bedtemp}
        M104 S{probe_temp} #by Codex AI

        {% if heatsoak == True %}
          M117 Short Heat Soak
          G4 P{heatsoak_time * 60000} # pause for x number of minute(s) (see variable_heat_soak_time)
        {% endif %}

        {% if printer.quad_gantry_level.applied|lower != 'true' %}
            M117 QGL
            BED_MESH_CLEAR
            QUAD_GANTRY_LEVEL_BASE #by Codex AI
            M117 Home Z after QGL
            G28 Z #by Codex AI
        {% endif %}

        #M117 Clean nozzle
        #CLEAN_NOZZLE CLEAN_TEMP={clean_temp} PROBE_TEMP={probe_temp} #by Codex AI
        #M117 Home Z after clean nozzle
        #G28 Z #by Codex AI

        M117 Bed Mesh
        BED_MESH_CALIBRATE_BASE ADAPTIVE=1 METHOD=rapid_scan #by Codex AI
        G90
        G1 Z0.600 F600
        G1 X0 Y0 F9000

        M117 Final Heating...
        {action_respond_info("Final heating...")}
        M140 S{bedtemp} ;set bed temp
        M104 S{hotendtemp} ;set extruder temp
        M190 S{bedtemp} ;wait for bed temp
        M109 S{hotendtemp};wait for extruder temp
        G1 Z0.6 F600
        G91
        G1 X88.000 F9000
        G1 X87.000 E20 F1800
        G1 Y1 E0.16 F1800
        G1 X-87.000 E20 F1800
        G1 Y1 E0.24 F100
        G1 X87.000 E20 F1800
        G1 E-0.200 Z1 F1600
        G90
        SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=state VALUE='"Start"' 
        UPDATE_DELAYED_GCODE ID=_print_start_wait DURATION=0.5
        #LINE_PURGE
    {% elif state == 'Start' %}
        M117 Printing
        {action_respond_info("Start!")}
    {% endif %}
[gcode_macro END_PRINT]
description: 
variable_state: 'normal'
gcode:
    {% set z_max = printer['gcode_macro _global_var'].z_maximum_lifting_distance|int %}
    {% set e_mintemp  = printer.configfile.settings['extruder'].min_extrude_temp %}

    M400
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=state VALUE='"Prepare"'
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=record_extruder_temp VALUE=0  
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=max_record_extruder_temp VALUE=0

    M117 Done
    G91
    {% if printer['filament_switch_sensor filament_sensor'].enabled == True and
          printer['filament_switch_sensor filament_sensor'].filament_detected == True
    %}
        {% if (printer.extruder.target != 0 and printer.extruder.temperature >= printer.extruder.target) or
              printer.extruder.temperature >= e_mintemp
        %}
            G1 E-2 F2700
            G1 E-2 Z0.2 F2400
        {% endif %}
    {% endif %}

    {% if (printer.gcode_move.position.z + 25) < z_max %}
        G1 Z+25 F3000
    {% else %}
        G1 Z+{(z_max - printer.gcode_move.position.z)} F3000
    {% endif %}
    G90
    G1 X0 Y360 F9000

    _ALL_FAN_OFF
    TURN_OFF_HEATERS

    M84 X Y Z E  

    M220 S100
    M221 S100

    CLEAR_PAUSE

    {action_respond_info("Finish Print!")}

[gcode_macro _IDLE_TIMEOUT]
gcode:
    {% if printer.print_stats.state == "paused" %}
      RESPOND TYPE=echo MSG="No operations in 10min!"
    {% else %}
     M84
     TURN_OFF_HEATERS
    {% endif %}

[delayed_gcode exhaust_fan_off]
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0

[gcode_macro _ALL_FAN_OFF]
gcode:
    M106 S0
    # Run the exhaust fan for another 2min after the other fans and then turn it off
    # UPDATE_DELAYED_GCODE ID=exhaust_fan_off DURATION=120
    M107

[gcode_macro CLEAN_NOZZLE]
description: Safe nozzle brush clean for Eddy tap probing #by Codex AI
gcode:
    {% set clean_temp = params.CLEAN_TEMP|default(200)|int %} #by Codex AI
    {% set probe_temp = params.PROBE_TEMP|default(130)|int %} #by Codex AI
    {% set retract = params.RETRACT|default(2.0)|float %} #by Codex AI
    {% set travel_z = params.TRAVEL_Z|default(15)|float %} #by Codex AI
    {% set brush_z = params.BRUSH_Z|default(0.8)|float %} #by Codex AI

    {% if printer.toolhead.homed_axes|lower != "xyz" %}
       G28
    {% endif %}
    SAVE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE #by Codex AI
    G90
    G1 Z{travel_z} F1200 #by Codex AI
    G1 X334 Y356 F9000 #by Codex AI
    M117 Nozzle heating...
    M109 S{clean_temp} #by Codex AI
    {% if retract > 0 %}
      M83 #by Codex AI
      G1 E-{retract} F1800 #by Codex AI
    {% endif %}
    G90
    M106 S255
    M104 S{probe_temp} #by Codex AI
    M117 Clean nozzle
    G1 X315 Y360 F9000 #by Codex AI
    G1 Z{brush_z} F600 #by Codex AI
    G1 X352 Y360 F4500 #by Codex AI
    G1 X324 Y360 F4500 #by Codex AI
    G1 X345 Y357 F4500 #by Codex AI
    G1 X324 Y360 F4500 #by Codex AI
    G1 X345 Y357 F4500 #by Codex AI
    G1 X324 Y360 F4500 #by Codex AI
    G1 X340 Y357 F4500 #by Codex AI
    G1 X324 Y360 F4500 #by Codex AI
    M400
    G1 Z{travel_z} F1200 #by Codex AI
    M107
    M117 Probe temp
    M109 S{probe_temp} #by Codex AI
    RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE MOVE=0 #by Codex AI
    M117 Finished cleaning
# Bring the nozzle to the center of the bed
[gcode_macro CENTER]
gcode:
    G0  X175 Y175 F5000

[gcode_macro _CALIBRATION_ZOFFSET]
gcode:
    RESPOND TYPE=echo MSG="Z-offset calibration disabled: Eddy tap homes with the nozzle. Use G28 or G28 Z." #by Codex AI

[delayed_gcode _auto_zoffset]
gcode:
    RESPOND TYPE=echo MSG="Auto Z-offset calibration disabled: Eddy tap is active." #by Codex AI

[gcode_macro _Delay_Calibrate]
gcode:
    RESPOND TYPE=echo MSG="Z-offset calibration disabled: Eddy tap is active." #by Codex AI
[delayed_gcode TEST_BELT]
initial_duration: 0.3
gcode:
    {% set x_freq = printer.save_variables.variables.x_freq|float %}
    {% set y_freq = printer.save_variables.variables.y_freq|float %}
    {% set show_freq = printer.save_variables.variables.show_freq %}
    {% if show_freq == 1 %}
        M117 x {x_freq}, y {y_freq}
        SAVE_VARIABLE VARIABLE=show_freq VALUE=0
    {% endif %}

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing:QUAD_GANTRY_LEVEL_BASE
description: Manual QGL at the current bed temperature #by Codex AI
gcode:
    QGL_NOW #by Codex AI


[gcode_macro QGL_NOW]
description: QGL at the current bed temperature without heat/cool wait #by Codex AI
gcode:
    BED_MESH_CLEAR #by Codex AI
    {% if printer.toolhead.homed_axes|lower != "xyz" %}
      G28 #by Codex AI
    {% else %}
      G28 Z #by Codex AI
    {% endif %}
    QUAD_GANTRY_LEVEL_BASE #by Codex AI
    G28 Z #by Codex AI
    G0 X175 Y175 Z30 F3600 #by Codex AI
